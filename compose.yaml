# The database is the shared folio_pro PostgreSQL (also used by folio-market-feed-svc) running on
# the Mac host. Compose runs only the API.
services:
  folio-pro-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: folio-pro-api:local
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SERVER_PORT: 8081
      POSTGRES_URL: jdbc:postgresql://host.docker.internal:${POSTGRES_HOST_PORT:-5432}/${POSTGRES_DB:-folio_pro}
      POSTGRES_USER: ${POSTGRES_USER:-folio_pro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      API_DEVELOPMENT_ONLY: "true"
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
